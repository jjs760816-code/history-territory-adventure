name: Online timequest checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          package_json_file: online-server/package.json
      - run: npm test
      - run: pnpm install --frozen-lockfile
        working-directory: online-server
      - run: npm run build && npm run validate && node --test test/worker.test.mjs test/timequest.test.mjs
        working-directory: online-server
